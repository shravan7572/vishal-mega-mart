<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Grocery Products - Vishal Mega Mart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#dc2626',
              darkRed: '#b91c1c',
              yellow: '#f59e0b',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

  <!-- Shared Navbar -->
  <div id="navbar"></div>

  <!-- Breadcrumb & Header -->
  <div class="bg-white border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <nav class="flex text-xs text-gray-500 gap-1.5 items-center mb-2">
        <a href="index.html" class="hover:text-red-600 transition">Home</a>
        <span>/</span>
        <span class="text-gray-800 font-semibold">Grocery Catalog</span>
      </nav>
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
        <h1 class="text-2xl sm:text-3xl font-black text-gray-900 tracking-tight">All Grocery Products</h1>
        <span id="productsCount" class="text-xs font-semibold text-gray-500 bg-gray-100 px-3 py-1 rounded-full w-fit">
          Loading products...
        </span>
      </div>
    </div>
  </div>

  <!-- Main Catalog Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full">
    
    <!-- Filter & Search Controls Bar -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
      
      <!-- Search Input within Catalog -->
      <form id="catalogSearchForm" class="flex-1 max-w-md">
        <div class="relative">
          <input
            type="text"
            id="catalogSearchInput"
            placeholder="Search within products..."
            class="w-full bg-gray-50 border border-gray-200 pl-10 pr-24 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white"
          />
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </div>
          <button type="submit" class="absolute inset-y-1 right-1 px-3 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold rounded-md transition">
            Search
          </button>
        </div>
      </form>

      <!-- Category Filter Dropdown & Sorter -->
      <div class="flex flex-wrap sm:flex-nowrap items-center gap-3">
        <!-- Category Dropdown -->
        <div class="flex items-center gap-2">
          <label for="categoryFilterSelect" class="text-xs font-bold text-gray-700 whitespace-nowrap">Category:</label>
          <select 
            id="categoryFilterSelect" 
            class="bg-gray-50 border border-gray-200 text-xs sm:text-sm text-gray-800 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-500 font-medium"
          >
            <option value="">All Categories</option>
          </select>
        </div>

        <!-- Sort By Dropdown -->
        <div class="flex items-center gap-2">
          <label for="sortSelect" class="text-xs font-bold text-gray-700 whitespace-nowrap">Sort By:</label>
          <select 
            id="sortSelect" 
            class="bg-gray-50 border border-gray-200 text-xs sm:text-sm text-gray-800 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-500 font-medium"
          >
            <option value="newest">Newest First</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Quick Category Pills -->
    <div id="categoryPills" class="flex gap-2 overflow-x-auto pb-4 mb-4 scrollbar-none">
      <!-- Injected via products.js -->
    </div>

    <!-- Products Grid -->
    <div id="productsCatalogGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
      <!-- Injected via products.js -->
    </div>

  </main>

  <!-- Shared Footer -->
  <div id="footer"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
