<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register - Vishal Mega Mart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#dc2626',
              darkRed: '#b91c1c',
              yellow: '#f59e0b',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

  <!-- Shared Navbar -->
  <div id="navbar"></div>

  <!-- Main Auth Container -->
  <main class="max-w-md mx-auto px-4 py-12 flex-grow w-full flex flex-col justify-center">
    
    <!-- Auth Card -->
    <div class="bg-white rounded-2xl shadow-md border border-gray-100 overflow-hidden">
      
      <!-- Card Header -->
      <div class="bg-red-600 p-6 text-center text-white">
        <div class="inline-flex w-12 h-12 bg-white text-red-600 rounded-xl items-center justify-center shadow mb-2">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        </div>
        <h1 class="text-xl font-black tracking-tight">VISHAL MEGA MART</h1>
        <p class="text-xs text-red-100 mt-0.5">Your neighborhood online grocery store</p>
      </div>

      <!-- Tab Switcher -->
      <div class="flex border-b border-gray-200 bg-gray-50">
        <button 
          id="tabBtnLogin" 
          onclick="switchTab('login')" 
          class="flex-1 py-3 text-sm font-bold text-red-600 border-b-2 border-red-600 transition"
        >
          Sign In
        </button>
        <button 
          id="tabBtnRegister" 
          onclick="switchTab('register')" 
          class="flex-1 py-3 text-sm font-semibold text-gray-500 hover:text-gray-700 transition"
        >
          New Account
        </button>
      </div>

      <div class="p-6">
        
        <!-- LOGIN FORM -->
        <form id="loginForm" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">Email Address</label>
            <input 
              type="email" 
              id="loginEmail" 
              required 
              placeholder="customer@example.com"
              class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white"
            />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">Password</label>
            <input 
              type="password" 
              id="loginPassword" 
              required 
              placeholder="••••••••"
              class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white"
            />
          </div>

          <button 
            type="submit" 
            id="btnLoginSubmit"
            class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-xl text-sm transition shadow-md hover:shadow-lg flex items-center justify-center gap-2"
          >
            <span>Sign In to Account</span>
          </button>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" class="hidden space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">Full Name</label>
            <input 
              type="text" 
              id="regName" 
              required 
              placeholder="e.g. Ramesh Kumar"
              class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white"
            />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">Email Address</label>
            <input 
              type="email" 
              id="regEmail" 
              required 
              placeholder="ramesh@example.com"
              class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white"
            />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">Password (Min. 8 characters) *</label>
            <input 
              type="password" 
              id="regPassword" 
              required 
              minlength="8"
              placeholder="Min. 8 chars with letters & numbers"
              class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white"
            />
            <p class="text-[11px] text-gray-500 mt-1">Must contain at least one letter and one number.</p>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">Account Role</label>
            <select 
              id="regRole" 
              class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white text-gray-800"
            >
              <option value="customer" selected>Customer (Buy Groceries)</option>
              <option value="admin">Administrator (Manage Store & Inventory)</option>
            </select>
          </div>

          <!-- Admin Security Password Field (visible only when Administrator is selected) -->
          <div id="adminKeyGroup" class="hidden bg-amber-50/70 border border-amber-200 rounded-lg p-3">
            <label class="block text-xs font-bold text-amber-900 uppercase tracking-wider mb-1">Admin Security Password *</label>
            <input 
              type="password" 
              id="regAdminKey" 
              placeholder="Enter administrator secret key"
              class="w-full bg-white border border-amber-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
            />
            <p class="text-[11px] text-amber-800 mt-1">
              Required to authorize administrator signup privileges.
            </p>
          </div>

          <button 
            type="submit" 
            id="btnRegisterSubmit"
            class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-xl text-sm transition shadow-md hover:shadow-lg flex items-center justify-center gap-2"
          >
            <span>Create Account</span>
          </button>
        </form>

      </div>
    </div>

  </main>

  <!-- Shared Footer -->
  <div id="footer"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
